<div class="login-wrapper">
  <div class="login-panel glass-panel">
    <div class="login-header">
      <div class="login-brand-icon">
        <i class="fa-solid fa-car-side"></i>
      </div>
      <h1 class="login-title">RentFlow SaaS</h1>
      <p class="login-subtitle">Plateforme de Gestion de Location de Véhicules</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-user"></i> Nom d'utilisateur</label>
        <input type="text" class="form-control" [(ngModel)]="username" name="username" placeholder="Nom d'utilisateur ou email" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-lock"></i> Mot de passe</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary login-btn" [disabled]="isLoading">
        <i class="fa-solid" [class.fa-right-to-bracket]="!isLoading" [class.fa-spinner]="isLoading" [class.fa-spin]="isLoading"></i>
        {{ isLoading ? 'Connexion en cours...' : 'Se Connecter' }}
      </button>
    </form>
  </div>
</div>
