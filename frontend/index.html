<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentFlow - Plateforme SaaS Intelligente de Location de Véhicules</title>
  <meta name="description" content="Solution SaaS Next-Gen de gestion de flotte et location de véhicules au Maroc et à l'international. Conformité DGI/ICE, inspection 2D tactile et scoring client.">
  
  <!-- CSS Globaux & Styles Composants -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="src/components/dashboard/dashboard.component.css">
  <link rel="stylesheet" href="src/components/fleet/fleet.component.css">
  <link rel="stylesheet" href="src/components/booking/booking.component.css">
  <link rel="stylesheet" href="src/components/crm/crm.component.css">
  <link rel="stylesheet" href="src/components/inspection/inspection.component.css">
  <link rel="stylesheet" href="src/components/billing/billing.component.css">
  <link rel="stylesheet" href="src/components/radars/radars.component.css">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Sidebar Nav -->
  <aside class="app-sidebar">
    <div class="sidebar-header">
      <div class="logo-badge">
        <i class="fa-solid fa-car-side" style="color: white;"></i>
      </div>
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 800; color: white;">RentFlow</h2>
        <span style="font-size: 0.7rem; color: #60a5fa; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">SaaS Fleet Mgmt</span>
      </div>
    </div>

    <ul class="nav-menu">
      <li class="nav-item active" id="nav-dashboard">
        <a href="#dashboard" onclick="window.app.navigate('dashboard')">
          <i class="fa-solid fa-chart-pie" style="width: 20px;"></i>
          <span>Tableau de Bord</span>
        </a>
      </li>
      <li class="nav-item" id="nav-fleet">
        <a href="#fleet" onclick="window.app.navigate('fleet')">
          <i class="fa-solid fa-car" style="width: 20px;"></i>
          <span>Gestion de Flotte</span>
        </a>
      </li>
      <li class="nav-item" id="nav-booking">
        <a href="#booking" onclick="window.app.navigate('booking')">
          <i class="fa-solid fa-calendar-days" style="width: 20px;"></i>
          <span>Planning Gantt</span>
        </a>
      </li>
      <li class="nav-item" id="nav-crm">
        <a href="#crm" onclick="window.app.navigate('crm')">
          <i class="fa-solid fa-users" style="width: 20px;"></i>
          <span>CRM & Anti-Fraude</span>
        </a>
      </li>
      <li class="nav-item" id="nav-inspection">
        <a href="#inspection" onclick="window.app.navigate('inspection')">
          <i class="fa-solid fa-clipboard-check" style="width: 20px;"></i>
          <span>Check-In / Out 2D</span>
        </a>
      </li>
      <li class="nav-item" id="nav-billing">
        <a href="#billing" onclick="window.app.navigate('billing')">
          <i class="fa-solid fa-file-invoice-dollar" style="width: 20px;"></i>
          <span>Factures DGI & Caisse</span>
        </a>
      </li>
      <li class="nav-item" id="nav-radars">
        <a href="#radars" onclick="window.app.navigate('radars')">
          <i class="fa-solid fa-triangle-exclamation" style="width: 20px;"></i>
          <span>PV Radars</span>
        </a>
      </li>
    </ul>

    <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--bg-card-border);">
      <button class="btn btn-secondary" style="width: 100%; justify-content: flex-start;" onclick="window.app.logout()">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        <span>Déconnexion</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <!-- Top Header -->
    <header class="app-header">
      <div class="tenant-selector">
        <i class="fa-solid fa-building" style="color: #3b82f6;"></i>
        <span id="header-tenant-name" style="font-weight: 600;">Atlas Rent-a-Car Casablanca</span>
        <span class="badge badge-DISPONIBLE" style="font-size: 0.65rem;">ICE: 001234567000089</span>
      </div>

      <div class="user-profile">
        <div style="text-align: right;">
          <div id="header-user-name" style="font-weight: 700; font-size: 0.9rem;">Amine El Amrani</div>
          <div id="header-user-role" style="font-size: 0.75rem; color: var(--text-muted);">Gérant Agence (Admin)</div>
        </div>
        <div class="avatar-circle" id="header-user-avatar">
          AE
        </div>
      </div>
    </header>

    <!-- Page Content Container -->
    <main class="page-container" id="app-content">
      <!-- Dynamic Modular Components Rendered Here -->
    </main>
  </div>

  <!-- Modal Container -->
  <div class="modal-backdrop" id="app-modal">
    <div class="modal-dialog glass-panel" id="modal-content">
      <!-- Modal Content Rendered Dynamically -->
    </div>
  </div>

  <!-- JS Core App Modules -->
  <script type="module" src="app.js"></script>
</body>
</html>
